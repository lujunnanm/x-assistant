<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神圣计划 · GitHub 海报</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#f3f6f8;background:#070c12}
.poster{position:relative;width:1600px;height:900px;padding:90px 112px;display:grid;grid-template-columns:1fr 590px;gap:82px;align-items:center;background:radial-gradient(circle at 82% 18%,#ff781f18 0,transparent 25%),radial-gradient(circle at 15% 86%,#293c5048 0,transparent 33%),linear-gradient(145deg,#121c28 0%,#080d14 50%,#05080d 100%)}
.poster:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#b5c1cb 0.55px,transparent 0.7px);background-size:5px 5px;mask-image:linear-gradient(90deg,#000,transparent 62%)}
.poster:after{content:"";position:absolute;width:760px;height:760px;border:2px solid #ff781f26;border-radius:50%;right:-300px;top:-390px;box-shadow:0 0 80px #ff781f12,inset 0 0 80px #ff781f0d}
.copy{position:relative;z-index:1;align-self:center}.brand{display:flex;align-items:center;gap:24px;margin-bottom:42px}.brand img{width:142px;height:142px;filter:drop-shadow(0 18px 28px #000b)}.tag{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 15px;border:1px solid #ff8a3d80;border-radius:18px;color:#ffab72;font-size:15px;font-weight:650;letter-spacing:.08em;background:#ff781f0e}.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:#ff781f;box-shadow:0 0 12px #ff781f}
h1{margin:0;font-size:90px;line-height:1.02;letter-spacing:-.035em;font-weight:760}h2{margin:18px 0 0;color:#b9c4d0;font-size:30px;font-weight:550;letter-spacing:.08em}.lead{max-width:660px;margin:34px 0 42px;color:#95a5b5;font-size:21px;line-height:1.8}.features{display:flex;gap:12px;flex-wrap:wrap}.features span{display:flex;align-items:center;gap:9px;height:40px;padding:0 17px;border-radius:13px;background:#1b2734;border:1px solid #344454;color:#dbe2e9;font-size:16px;box-shadow:inset 0 1px #7f94a523,0 6px 12px #0004}.features i{display:block;width:6px;height:6px;border-radius:50%;background:#ff781f}
.version{margin-top:40px;color:#6f8295;font-size:14px;letter-spacing:.12em}
.console-wrap{position:relative;z-index:1;display:grid;place-items:center}.console-wrap:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:#ff781f18;filter:blur(90px)}
.console{position:relative;width:528px;padding:28px;border-radius:34px;background:radial-gradient(ellipse at 0 0,#30405577,transparent 65%),linear-gradient(145deg,#172230,#0b121c);box-shadow:inset 0 1px 1px #8094a43c,inset 0 -1px #02070f,0 35px 70px #000b;border:1px solid #3c4b5b}
.console header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.console strong{display:flex;align-items:center;gap:14px;font-size:26px}.console strong img{width:52px;height:52px}.close{position:relative;width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,#4a4e54,#25282e);border:1px solid #666b72;box-shadow:inset 0 1px #adb3bb4d,0 2px 0 #c0c6cf,0 7px 0 #07090d,0 10px 16px #0008}.close:after{content:"";position:absolute;left:50%;top:50%;width:16px;height:2px;border-radius:2px;background:#e7ebef;transform:translate(-50%,-50%)}
.controls{display:grid;grid-template-columns:1fr 106px;gap:16px;margin-bottom:20px}.key{height:50px;border-radius:25px;display:grid;place-items:center;background:linear-gradient(155deg,#4a4e54,#25282e);border:1px solid #686d75;color:#f3f4f5;font-size:17px;font-weight:700;box-shadow:inset 0 1px #afb3bc52,inset 0 -1px #050609,0 3px 0 #ff781f,0 8px 0 #07090d,0 12px 18px #0008}.key.follow{color:#ffb17a;font-size:15px}
.module{height:86px;margin-top:13px;padding:0 18px;display:grid;grid-template-columns:48px 74px 1fr 112px;align-items:center;gap:12px;border-radius:24px;background:linear-gradient(145deg,#263341,#17212e);box-shadow:inset 0 1px #7a8c9c38,inset 0 -1px #09111ccc,0 8px 15px #0007}.icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#ff8a3d;background:linear-gradient(145deg,#101823,#253343);box-shadow:inset 0 2px 5px #000a,inset 0 -1px #8999a52b}.icon svg{width:25px;height:25px}.module b{font-size:18px}.dash{justify-self:center;color:#ff8a3d;font-size:24px;font-weight:700}.state{justify-self:end;display:flex;align-items:center;gap:10px;color:#abb8c5;font-size:16px}.state:before{content:"";width:9px;height:9px;border-radius:50%;background:#8191a4}.module .small-key{justify-self:end;width:104px;height:44px;border-radius:22px;font-size:16px}.corner{position:absolute;right:58px;bottom:42px;color:#ff8a3d3d;font-size:130px;font-weight:800;line-height:1;transform:rotate(-12deg);user-select:none}
</style>
</head>
<body>
<main class="poster">
  <section class="copy">
    <div class="brand"><img src="../icons/logo-1024.png" alt=""><div><div class="tag">CHROMIUM EXTENSION</div><h2>一个开关，协调全部任务</h2></div></div>
    <h1>神圣计划</h1>
    <p class="lead">在 X 页面内协调发帖、互动、通知回帖与低曝光清理。直接调用 DeepSeek，保留发送回执与安全停止边界。</p>
    <div class="features"><span><i></i>自动发帖</span><span><i></i>主动互动</span><span><i></i>通知回帖</span><span><i></i>独立清理</span></div>
    <div class="version">OPEN SOURCE · v4.0.14</div>
  </section>
  <section class="console-wrap">
    <div class="console">
      <header><strong><img src="../icons/icon-128.png" alt="">神圣计划</strong><span class="close"></span></header>
      <div class="controls"><span class="key">启动协同</span><span class="key follow">关注</span></div>
      <div class="module"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 21 1-6L18 3l5 5L11 20Z M15 6l5 5"/></svg></span><b>发帖</b><span class="dash">−</span><span class="state">已停止</span></div>
      <div class="module"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12a10 10 0 0 1-10 10H3l2-5A10 10 0 1 1 22 12Z"/><path d="M8 12h.1M12 12h.1M16 12h.1"/></svg></span><b>互动</b><span class="dash">−</span><span class="state">已停止</span></div>
      <div class="module"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12a10 10 0 0 1-10 10H3l2-5A10 10 0 1 1 22 12Z"/><path d="M8 12h.1M12 12h.1M16 12h.1"/></svg></span><b>回帖</b><span class="dash">−</span><span class="state">已停止</span></div>
      <div class="module"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14M9 6V3h6v3M7 6l1 15h8l1-15M10 9v9M14 9v9"/></svg></span><b>清理</b><span class="dash">−</span><span class="key small-key">开始</span></div>
    </div>
  </section>
  <span class="corner">✦</span>
</main>
</body>
</html>
